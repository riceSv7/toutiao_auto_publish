name: 定时发布头条文章

on:
  schedule:
    # UTC时间 0点、4点、10点 = 北京时间 8点、12点、18点
    - cron: '0 0,4,10 * * *'
  workflow_dispatch:  # 允许手动触发

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          playwright install chromium
          playwright install-deps

      - name: 运行发布脚本
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          TOUTIAO_COOKIE: ${{ secrets.TOUTIAO_COOKIE }}
        run: python main.py

      - name: 上传调试截图
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: toutiao-screenshots
          path: "*.png"
